<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Partner frame</title>
<style>body{font:14px system-ui,sans-serif;margin:10px}</style></head>
<body>
<label for="pc">Partner code</label> <input id="pc">
<button id="apply" type="button">Apply code</button>
<p id="cross-out"></p>
<script>
document.getElementById('apply').addEventListener('click', function () {
  var v = document.getElementById('pc').value;
  fetch('/api/submit/cross', { method: 'POST', body: JSON.stringify({ code: v }) }).then(function () {
    document.getElementById('cross-out').textContent = 'Applied: ' + v;
  });
});
</script>
</body>
</html>
