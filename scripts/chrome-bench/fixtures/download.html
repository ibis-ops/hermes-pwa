<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Downloads</title>
<style>body{font:15px/1.5 system-ui,sans-serif;margin:24px;max-width:640px}</style></head>
<body>
<main>
<h1>Downloads</h1>
<p><a id="rep" href="/download/report.csv">Download report</a> (served as an attachment)</p>
<p><a id="bin" href="/download/data.bin">Get data file</a></p>
<p><button id="export" type="button">Export CSV</button> (built in the page as a blob)</p>
</main>
<script>
document.getElementById('export').addEventListener('click', function () {
  var csv = 'id,name\n1,alpha\n2,beta\n3,gamma\n';
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'export.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
});
</script>
</body>
</html>
