<h2>Draft</h2>
<p><button type="button" id="save">Save draft</button></p>
<p id="status" role="status"></p>
</main>
<script>
// A dialog nobody asked for: an alert 300 ms after load.
function post(v) { fetch('/api/submit/trouble', { method: 'POST', body: JSON.stringify(v) }); }
setTimeout(function () { alert('Your session expires in 5 minutes'); post({ alerted: true }); }, 300);
document.getElementById('save').addEventListener('click', function () {
  document.getElementById('status').textContent = 'Draft saved at 10:42';
  post({ saved: true });
});
</script>
