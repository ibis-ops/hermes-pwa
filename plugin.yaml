name: hermes-pwa
version: 0.1.2-beta
description: Installable mobile PWA client for Hermes Dashboard
provides_tools:
  - chrome
  - chrome_history
provides_hooks:
  - pre_approval_request
  - post_approval_response
  - post_llm_call
# Installed into the Hermes venv by `hermes pm` so Web Push survives venv rebuilds.
pip_dependencies:
  - pywebpush>=2.0
